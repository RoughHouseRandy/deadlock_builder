<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Builder</title>
    <link rel="icon" href="images/hammer.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1> Deadlock Builder</h1>
        <img src="images/hammer.png" alt="a hammer icon with crosshairs around it.">
    </header>
    <div id="main">
        <div id="items">
            <h2>Select Items</h2>
        </div>
        <div id="characters">
            <h2>Select Character</h2>
            <select>
                <option value="none"> - Please select a character - </option>
            </select>
        </div>
        <div id="builder">
            <h2>Build</h2>
        </div>
    </div>
</body>
</html>
